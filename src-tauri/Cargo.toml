[package]
name = "sacpl-loans"
version = "0.1.0"
description = "SacPL Loans - Sacramento Public Library menu bar app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sacpl_loans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Debug build only: Developer Settings (hidden browser, App Log viewer,
# Debug Events) and the SACPL_DIAG probes. Default builds compile these out
# to keep the bundle lean. Build with:
#   npm run tauri build -- --features debug-mode
default = []
debug-mode = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native"] }
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
