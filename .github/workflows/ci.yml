name: CI

on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
